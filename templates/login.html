<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Smart Classroom</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: linear-gradient(135deg, #1e1b4b, #0f172a 55%, #111827); min-height: 100vh; color: #e5e7eb; display: grid; place-items: center; padding: 20px; }
    .card { width: min(460px, 100%); background: #111827; border: 1px solid #334155; border-radius: 18px; padding: 28px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
    h1 { margin: 0 0 8px; }
    p { color: #94a3b8; margin: 0 0 20px; }
    input, button { width: 100%; font: inherit; border-radius: 10px; }
    input { background: #020617; color: #e5e7eb; border: 1px solid #334155; padding: 14px 16px; margin-bottom: 12px; }
    button { border: 0; padding: 14px 18px; background: #4f46e5; color: white; font-weight: 800; cursor: pointer; }
    a { color: #a5b4fc; text-decoration: none; font-weight: 700; }
    .msg { padding: 10px 12px; border-radius: 10px; margin-bottom: 12px; font-size: 14px; }
    .error { background: rgba(220, 38, 38, .18); color: #fecaca; }
    .success { background: rgba(22, 163, 74, .18); color: #bbf7d0; }
    .footer { margin-top: 18px; text-align: center; color: #94a3b8; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Smart Classroom Login</h1>
    <p>Login as teacher or student to continue.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="msg {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post">
      <input type="email" name="email" placeholder="Email address" required />
      <input type="password" name="password" placeholder="Password" required />
      <button type="submit">Login</button>
    </form>
    <div class="footer">New here? <a href="{{ url_for('register_page') }}">Create an account</a></div>
  </main>
</body>
</html>
